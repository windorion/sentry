name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify immutable Action references
        run: ./scripts/verify-actions-pinned.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  cross-platform:
    name: Release smoke test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release --locked
      - name: Smoke test packaged CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/wsentry --version
          ./target/release/wsentry validate --config wsentry.example.toml
          ./target/release/wsentry doctor --json
      - name: Smoke test packaged CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\release\wsentry.exe --version
          .\target\release\wsentry.exe validate --config wsentry.example.toml
          .\target\release\wsentry.exe doctor --json
