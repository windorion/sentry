name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  cross-platform:
    name: Release smoke test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Smoke test packaged CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/wsentry --version
          ./target/release/wsentry validate --config wsentry.example.toml
          ./target/release/wsentry doctor --json
      - name: Smoke test packaged CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\release\wsentry.exe --version
          .\target\release\wsentry.exe validate --config wsentry.example.toml
          .\target\release\wsentry.exe doctor --json
