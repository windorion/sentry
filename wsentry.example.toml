# Windorion Sentry project configuration
schema_version = 1
refresh_interval_ms = 1000
socket_refresh_interval_ms = 2000
log_refresh_interval_ms = 500
history_points = 120
log_buffer_lines = 2000
event_buffer_entries = 500

[thresholds]
cpu_percent = 85.0
memory_percent = 90.0
disk_percent = 90.0

[[service]]
name = "api"
health = "http://localhost:8080/health"
interval = "10s"
timeout = "3s"

[[log]]
name = "api"
path = "./logs/api.log"

[[service]]
name = "postgres"
tcp = "localhost:5432"
interval = "30s"
timeout = "3s"
